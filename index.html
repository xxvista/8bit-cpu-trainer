<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Electronics Kits Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a white lab bench. The computer is drawn from its real PCB files on the left;
   a sticky instrument panel on the right explains and controls it. Colour belongs to the boards and LEDs. */
:root{
  color-scheme:light;
  --page:#ffffff; --soft:#f5f6f8; --ink:#111827; --muted:#5d6878; --line:#dfe3e9; --accent:#1746d1; --accent-soft:#e8eeff;
  --good:#16864a; --bad:#cc2b2b; --warn:#b97a00;
  --red:#ff3b30; --yellow:#ffc400; --green:#1fd65f; --blue:#2f8bff;
  --mask:#1f7a4a; --trace:#2f9c61; --silk:#f2f6f1; --copper:#d9b34a;
  --f-display:"Saira Condensed","IBM Plex Sans Arabic","Arial Narrow",sans-serif;
  --f-body:"Instrument Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Spline Sans Mono",ui-monospace,Menlo,Consolas,monospace;
}
[data-board="white"]{--mask:#eeede6;--trace:#dddbd0;--silk:#1b1d21}
[data-board="black"]{--mask:#1c1e22;--trace:#2c3036;--silk:#eef0f2}
[data-board="blue"]{--mask:#1c4c9a;--trace:#2a61b6;--silk:#f2f5fb}
[data-board="red"]{--mask:#a3262b;--trace:#b9383d;--silk:#fff5f5}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1560px;margin:0 auto;padding:0 24px 64px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
p{margin:0}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code,kbd{font-family:var(--f-mono);font-size:.9em;background:var(--soft);border:1px solid var(--line);padding:0 4px;border-radius:4px}
kbd{box-shadow:0 1px 0 var(--line)}

header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding:18px 0 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{font-size:32px;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.brand h1 span{color:var(--accent)}
.brand p{color:var(--muted);font-size:14px}
nav{display:flex;gap:2px;background:var(--soft);padding:4px;border-radius:10px}
nav a{font-weight:600;font-size:14px;text-decoration:none;color:var(--muted);padding:7px 14px;border-radius:7px}
nav a:hover{color:var(--ink)}
nav a[aria-current="page"]{color:var(--ink);background:var(--page);box-shadow:0 1px 3px rgba(17,24,39,.14)}
.view{display:none;padding-top:18px}
.view.active{display:block}

.btn{background:var(--page);border:1px solid var(--line);padding:7px 13px;font-weight:600;font-size:14px;cursor:pointer;border-radius:8px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn:active{background:var(--soft)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.small{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn kbd{background:rgba(255,255,255,.18);border-color:transparent;box-shadow:none;font-size:11px;padding:0 5px}
.btn:not(.primary) kbd{background:var(--soft);color:var(--muted)}
select,input[type=text]{background:var(--page);border:1px solid var(--line);padding:6px 9px;border-radius:8px;max-width:100%}
input[type=range]{accent-color:var(--accent)}

.sim{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(380px,1fr);gap:24px;align-items:start}
.stage{position:sticky;top:12px;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.stagehead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.transport{display:flex;gap:6px;flex-wrap:wrap}
.tbtn{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:var(--page);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.tbtn:hover:not(:disabled){border-color:var(--ink)}
.tbtn:disabled{opacity:.4;cursor:not-allowed}
.tbtn svg,.tbtn .ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tbtn .ico{display:inline-flex}
.tbtn .sm{display:none}
.tbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff;padding:0 16px}
.tbtn.primary:hover:not(:disabled){filter:brightness(1.1);border-color:var(--accent)}
.tbtn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tbtn kbd{font-size:10.5px;padding:0 5px;background:var(--soft);color:var(--muted);border-color:transparent;box-shadow:none}
.tbtn.primary kbd,.tbtn.on kbd{background:rgba(255,255,255,.2);color:#fff}
.tipbar{display:flex;align-items:flex-start;gap:10px;background:#fff8db;border:1px solid #f1d77a;border-radius:10px;padding:9px 12px;font-size:14px}
.tipbar[hidden]{display:none}
.tipbar span{flex:1}
.tipbar button{background:none;border:none;font-size:20px;line-height:1;cursor:pointer;color:var(--muted);padding:0 2px}
.pcbwrap{margin:0 auto;width:100%}
.stagebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:13px;color:var(--muted)}
.stagebar .btn[hidden]{display:none}
.stagebar label{display:flex;align-items:center;gap:6px}
.swatches{display:flex;gap:5px}
.swatches button{width:20px;height:20px;border-radius:50%;border:2px solid var(--page);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.spacer{flex:1}
.pcbwrap{position:relative}
#pcb .flow path{fill:none;stroke-linecap:round;stroke-linejoin:round}
#pcb .flow .under{stroke:rgba(0,0,0,.55);stroke-width:3.4}
#pcb .flow .line{stroke:#ffd23f;stroke-width:1.9;stroke-dasharray:3.2 2.2}
#pcb .flow .tag rect{fill:#ffd23f;stroke:rgba(0,0,0,.6);stroke-width:.4}
#pcb .flow .tag text{font-family:var(--f-mono);font-size:5.2px;font-weight:700;fill:#111;text-anchor:middle;dominant-baseline:central}
@media (prefers-reduced-motion:no-preference){#pcb .flow .line{animation:flowdash .55s linear infinite}}
@keyframes flowdash{to{stroke-dashoffset:-5.4}}
svg#pcb{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.pill{position:absolute;transform:translate(-50%,-100%);background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none;box-shadow:0 1px 4px rgba(17,24,39,.18);display:flex;gap:7px;align-items:center}
.pill b{font-family:var(--f-mono);font-weight:600;color:var(--accent)}
.pill.drive{background:var(--accent);color:#fff;border-color:var(--accent)}
.pill.drive b{color:#fff}
.pill.latch{border:1.5px dashed var(--ink)}
.pill i{font-style:normal;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;opacity:.85}
.nolabels .pill{display:none}
#tip{position:fixed;z-index:20;background:var(--ink);color:#fff;font-size:12.5px;padding:6px 10px;border-radius:8px;pointer-events:none;max-width:260px;display:none;line-height:1.35}
#tip b{font-family:var(--f-mono);font-weight:600}

/* PCB drawing */
.mask{fill:var(--mask);stroke:rgba(0,0,0,.35);stroke-width:.25;cursor:zoom-in}
.zoomed .mask{cursor:zoom-out}
.tr{fill:none;stroke:var(--trace);stroke-width:.32;stroke-linecap:round}
.silk{fill:var(--silk);font-family:var(--f-display);font-weight:600;pointer-events:none}
.pad{fill:var(--copper)}
.hole{fill:var(--soft);stroke:var(--copper);stroke-width:.7}
.icb{fill:#22252b;stroke:#0c0d10;stroke-width:.15}
.ict{fill:#c9ced6;font-family:var(--f-mono);font-weight:500;pointer-events:none}
.hdr{fill:#17181b}
.lead{stroke:#b9bec6;stroke-width:.45}
.resb{stroke:#d9c39a;stroke-width:2;stroke-linecap:round}
.capb{fill:#d08a2e;stroke:#8f5a13;stroke-width:.15}
.capp{fill:#20283a;stroke:#0d1220;stroke-width:.15}
.metal{fill:#c7ccd4;stroke:#7d8490;stroke-width:.15}
.led{--c:var(--red);fill:color-mix(in srgb,var(--c) 26%,#f4f4f4);stroke:rgba(0,0,0,.35);stroke-width:.2}
.led.on{fill:var(--c)}
.halo{--c:var(--red);fill:var(--c);opacity:0;pointer-events:none}
.halo.on{opacity:.38}
.y{--c:var(--yellow)}.g{--c:var(--green)}.b{--c:var(--blue)}
.act{cursor:pointer}
.act:hover .hl{stroke:#fff;stroke-width:.6}
.btnb{fill:#2d3036;stroke:#0c0d10;stroke-width:.2}
.btnc{fill:#101114}
.act:active .btnc{fill:var(--accent)}
.swb{fill:#17181b;stroke:#000;stroke-width:.15}
.swk{fill:#f1f1f1;stroke:#777;stroke-width:.12}
.dipb{fill:#c92f2f;stroke:#7d1616;stroke-width:.15}
.dips{fill:#5d1010}
.potb{fill:#2b63cc;stroke:#173a7c;stroke-width:.2}
.dispb{fill:#0c120e;stroke:#000;stroke-width:.2}
.seg{fill:#152219}
.seg.on{fill:#4dff8a}
.outline{fill:none;stroke:none;pointer-events:none}
.outline.drive{stroke:var(--accent);stroke-width:1.6}
.outline.latch{stroke:#fff;stroke-width:1.2;stroke-dasharray:3 2}
.cardname{fill:var(--silk);font-family:var(--f-display);font-weight:700;opacity:.9;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.led,.halo,.seg{transition:fill .1s,opacity .1s}}

/* Side panel */
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.speed{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex:1 1 200px;min-width:180px}
.speed input{flex:1}
.now{border:1px solid var(--line);border-inline-start:5px solid var(--accent);border-radius:10px;padding:12px 14px;background:var(--page)}
.now.halted{border-inline-start-color:var(--bad)}
.now.prog{border-inline-start-color:var(--warn)}
.now .phase{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.now .phase strong{font-family:var(--f-display);font-size:24px;font-weight:700;text-transform:uppercase}
.now .phase span{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.now p{margin-top:4px}
.tsteps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-top:12px}
.tsteps span{position:relative;height:26px;border-radius:6px;background:var(--soft);border:1px solid var(--line);font-family:var(--f-mono);font-size:11.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center}
.tsteps span.f{background:#eef2ff}
.tsteps span.no{opacity:.45}
.tsteps span.done{background:var(--accent-soft);border-color:#b9c7f5;color:var(--accent)}
.tsteps span.cur{background:var(--accent);border-color:var(--accent);color:#fff}
.tsteps i{font-style:normal;font-size:11.5px;color:var(--muted);text-align:center;border-top:2px solid var(--line);padding-top:3px;margin-top:2px}
.tabs{display:flex;flex-wrap:wrap;gap:2px;background:var(--soft);padding:4px;border-radius:12px}
.tabs button{flex:1 1 auto;background:none;border:none;border-radius:9px;padding:7px 10px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--page);box-shadow:0 1px 3px rgba(17,24,39,.14)}
.tab{display:none;padding-top:12px}
.tab.active{display:block}
.sub{color:var(--muted);font-size:13px;margin-bottom:8px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:4px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.mono td,td.m{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.regs td:first-child{color:var(--muted);font-family:var(--f-body)}
.regs td b{font-weight:600}
.sigs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-top:10px}
.sig{border:1px solid var(--line);border-radius:7px;padding:4px 7px;font-size:11px;color:var(--muted);line-height:1.25;background:var(--soft)}
.sig b{display:block;font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.sig.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.sig.on b{color:var(--accent)}
textarea#src{width:100%;min-height:250px;font-family:var(--f-mono);font-size:13.5px;line-height:1.55;background:var(--soft);border:1px solid var(--line);padding:10px;resize:vertical;border-radius:8px;tab-size:4}
.rowf{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.rowf input[type=text]{flex:1;min-width:120px}
#asmMsg{font-size:13px;min-height:20px;font-weight:600}
#asmMsg.err{color:var(--bad)}#asmMsg.ok{color:var(--good)}
table.ram tr.mar td{background:#fff6d6}
table.ram .pcm{color:var(--good);font-weight:600;font-family:var(--f-body);font-size:11px}
.bp{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);background:none;padding:0;cursor:pointer;vertical-align:middle}
.bp.on{background:var(--bad);border-color:var(--bad)}
.bits{display:flex;gap:2px}
.bits .gap{width:5px}
.bit{width:17px;height:21px;border:1px solid var(--line);background:var(--page);font-family:var(--f-mono);font-size:11.5px;padding:0;cursor:pointer;border-radius:4px;color:var(--muted)}
.bit.on{background:var(--ink);color:#fff;border-color:var(--ink)}
table.uc td{font-family:var(--f-mono);font-size:11.5px;white-space:nowrap}
table.uc tr.cur td{background:var(--soft)}
table.uc td.cur{background:var(--accent);color:#fff}
.empty{color:var(--muted);font-size:13px;padding:12px 0}

/* Prose views */
.prose{max-width:68ch}
.prose h2{font-size:34px;font-weight:700;text-transform:uppercase;margin:0 0 6px}
.prose h3{font-size:23px;font-weight:600;margin:26px 0 8px;text-transform:uppercase;letter-spacing:.02em}
.prose p{margin:0 0 10px}
.prose ol,.prose ul{margin:0 0 12px;padding-inline-start:22px}
.prose li{margin-bottom:6px}
.lead{font-size:17px;color:var(--muted)}
.callout{border:1px solid var(--line);border-inline-start:5px solid var(--warn);border-radius:10px;background:var(--soft);padding:10px 14px;margin:14px 0}
.twocol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px;align-items:start}
.simthis{align-self:flex-start;margin-top:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-top:16px}
.card{background:var(--page);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card h3{font-size:22px;font-weight:600;text-transform:uppercase}
.card .slot{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.card svg{width:100%;height:auto;max-height:230px;background:var(--soft);border-radius:8px;padding:6px}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.card dt{color:var(--muted)}
.card dd{margin:0}
.card pre{margin:0;font-family:var(--f-mono);font-size:12.5px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px;overflow-x:auto;line-height:1.5}
.card .num{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--accent);letter-spacing:.1em}
.card ul{margin:0;padding-inline-start:18px;font-size:13.5px}
.card .btn{align-self:flex-start;margin-top:auto}
.result{font-size:13px;font-weight:600;min-height:20px}
.result.ok{color:var(--good)}.result.err{color:var(--bad)}
h2.sec{font-size:26px;font-weight:700;text-transform:uppercase;margin:34px 0 0}


/* language and right-to-left */
[dir="rtl"] *{letter-spacing:0 !important}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3{line-height:1.35}
.ltr,.pcbwrap,textarea#src,.m,.mono td,table.uc,.bits,code,kbd,pre{direction:ltr;unicode-bidi:isolate}
.mono td,.m,table.uc td{text-align:left}
th{text-align:start}
.m span[dir]{font-family:var(--f-body)}
[dir="rtl"] .now .phase span{font-family:var(--f-body)}
.headtools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
nav a.cta{background:var(--accent);color:#fff}
nav a.cta[aria-current="page"]{background:var(--accent);color:#fff;box-shadow:0 0 0 2px var(--ink)}
/* kit page */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:32px;align-items:center}
.hero h2{font-size:46px;font-weight:700;text-transform:uppercase}
.hero img,.gallery img{width:100%;height:auto;display:block;border-radius:12px;border:1px solid var(--line)}
.facts{display:flex;flex-wrap:wrap;gap:22px;margin:18px 0}
.facts div{font-size:13px;color:var(--muted)}
.facts b{display:block;font-family:var(--f-display);font-size:34px;line-height:1;color:var(--ink)}
.ctas{display:flex;flex-wrap:wrap;gap:10px}
.btn.big{padding:11px 20px;font-size:16px}
a.btn{text-decoration:none}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:14px}
.product{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--page)}
.product.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.product h3{font-size:24px;font-weight:600;text-transform:uppercase}
.product p{font-size:14px;color:var(--muted)}
.price{font-family:var(--f-display);font-size:24px;font-weight:700;margin-top:auto}
.price.req{font-size:17px;color:var(--muted);font-weight:600}
.stepper{display:flex;align-items:center;gap:8px;font-size:14px}
.stepper button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--page);font-size:18px;cursor:pointer}
.stepper button:hover{border-color:var(--ink)}
.stepper output{min-width:34px;text-align:center;font-family:var(--f-mono);font-weight:600;font-size:16px}
.boxgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start;margin-top:12px}
.boxlist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 18px;font-size:14px}
.boxlist li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:4px 0}
.boxlist span{color:var(--muted);font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:12px}
.gallery figure{margin:0}
.gallery figcaption{font-size:13px;color:var(--muted);margin-top:4px}
details.bom{border:1px solid var(--line);border-radius:10px;padding:0 14px;margin-top:8px;background:var(--page)}
details.bom summary{cursor:pointer;padding:10px 0;font-weight:600;display:flex;justify-content:space-between;gap:10px}
details.bom summary span{color:var(--muted);font-weight:400;font-size:13px}
details.bom table{margin-bottom:12px}
.orderbox{border:1px solid var(--line);border-radius:14px;padding:20px;background:var(--soft);margin-top:12px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.form{display:grid;gap:10px}
.form label{display:grid;gap:3px;font-size:13px;font-weight:600}
.form input,.form select,.form textarea{width:100%;background:var(--page);border:1px solid var(--line);padding:8px 10px;border-radius:8px;font-weight:400;font-size:15px}
.form textarea{min-height:70px;resize:vertical}
.ordersum{background:var(--page);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ordersum pre{margin:0;white-space:pre-wrap;font-family:var(--f-mono);font-size:13px;line-height:1.5;direction:inherit;unicode-bidi:plaintext;max-height:320px;overflow:auto}
.ordersum h3{font-size:22px;font-weight:600;text-transform:uppercase}
.contact{font-size:14px;color:var(--muted)}
.contact b{color:var(--ink);font-family:var(--f-mono);font-weight:600}
.creditline{margin-top:28px;font-size:13px;color:var(--muted);max-width:80ch}
.card img{width:100%;height:auto;border-radius:8px;border:1px solid var(--line)}
table.course td{vertical-align:top;font-size:14px}
table.course td:first-child{font-weight:600}
/* timing, faults, about */
.tmwrap{display:flex;border:1px solid var(--line);border-radius:8px;background:var(--page);padding:6px 0}
.tmlab{flex:none;border-right:1px solid var(--line)}
.tmscroll{overflow-x:auto;flex:1;min-width:0}
svg.tm{display:block;font-family:var(--f-mono)}
.tm .tml{font-size:10px;fill:var(--ink);font-weight:600}.tm .tml.dim{fill:#b3bac4;font-weight:400}
.tm .tmn{font-size:9px;fill:var(--muted)}
.tm .tmg{stroke:var(--line);stroke-width:.6}
.tm .tmw{fill:none;stroke:#b3bac4;stroke-width:1.2}.tm .tmw.act{stroke:var(--accent)}
.tm .tmfill{fill:var(--accent-soft)}
.tm .tmbox{fill:var(--soft);stroke:var(--line)}.tm .tmbox.bus{fill:#fff6d6;stroke:#e8c96a}
.tm .tmv{font-size:8.5px;fill:var(--ink)}
.tm .tmcur{fill:#fff1c2;opacity:.6}
details.faq{border-bottom:1px solid var(--line);padding:8px 0}
details.faq summary{cursor:pointer;font-weight:600}
details.faq p{margin:6px 0 2px;color:var(--muted)}
.prose a{color:var(--accent)}
@media (max-width:1050px){.hero,.boxgrid,.orderbox{grid-template-columns:1fr}.hero h2{font-size:36px}}
@media (max-width:1050px){
  .sim{grid-template-columns:minmax(0,1fr)}
  nav{flex-wrap:wrap}
  .stagebar>span:first-child{flex-basis:100%}
  .side{position:static}
  .twocol{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){
  .wrap{padding:0 16px 48px}
  header.top{flex-wrap:nowrap;padding:14px 0}
  .brand h1{font-size:23px}
  .brand p{display:none}
  #lang{padding:5px 6px;font-size:14px}
  .sigs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pill i{display:none}
}
/* home page and kit bar */
a.brand{text-decoration:none;color:inherit}
a.brand:hover h1{color:var(--accent)}
.kitbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding:12px 0;border-bottom:1px solid var(--line)}
.kitbar[hidden]{display:none}
.kitname{font-family:var(--f-display);font-size:22px;font-weight:700;text-transform:uppercase;text-decoration:none;color:var(--ink)}
.kitname span{color:var(--accent)}
/* home page: one centred column, generous spacing between sections */
#view-home{padding-top:0}
#homeBody,#soonBody,#arduinoBody{max-width:1160px;margin:0 auto}
body:not([data-view="cpu"]) header.top{max-width:1160px;margin:0 auto}
#soonBody{padding:48px 0 24px}
.homehero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);grid-template-areas:"text img" "facts facts";gap:48px 64px;align-items:center;padding:72px 0 24px}
.herotext{grid-area:text}
.heroimg{grid-area:img;margin:0}
.heroimg img{width:100%;height:auto;display:block}
.heroimg figcaption,.bdraw+figcaption{font-size:13px;color:var(--muted);margin-top:8px;text-align:center}
.bdraw{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:14px;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
.bdraw svg{width:100%;height:100%;display:block}
.kitcard .pic img.illus{object-fit:contain;padding:14px}
.hero img.illus,.hero > img{object-fit:contain;border:none}
.homehero h2{font-size:64px;line-height:1;font-weight:700;text-transform:uppercase;margin-top:20px}
.homehero .lead{margin:22px 0 32px;max-width:52ch;font-size:19px;line-height:1.6}
.homehero .facts{grid-area:facts;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin:0;padding-top:32px;border-top:1px solid var(--line)}
.homehero .facts div{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.homehero .facts b{font-family:var(--f-display);font-size:44px;line-height:1;color:var(--ink)}
.eyebrow{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:5px 14px}
.hsec{padding:88px 0;scroll-margin-top:16px}
.hsec+.hsec:not(.band){border-top:1px solid var(--line)}
.band+.hsec,.hsec+.band{border-top:none}
.band{background:var(--soft);box-shadow:0 0 0 100vmax var(--soft);clip-path:inset(0 -100vmax)}
.hhead{max-width:640px;margin-bottom:40px}
.hhead h2,.who>h2,.faqsec>h2,.ctabox h2{font-size:40px;line-height:1.05;font-weight:700;text-transform:uppercase}
.hhead .lead{margin-top:14px;font-size:18px;line-height:1.6}
#homeBody .btn,#soonBody .btn{white-space:normal;text-align:center}
.who{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:32px 64px;align-items:start}
.whotext{font-size:21px;line-height:1.6;color:var(--ink);max-width:56ch}
.forlbl{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:32px 0 12px}
.audience{display:flex;flex-wrap:wrap;gap:10px}
.audience span{background:var(--page);border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-size:14px;font-weight:600;color:var(--muted)}
.path{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);gap:20px;align-items:stretch}
.pathstep{border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;background:var(--page);transition:border-color .15s,transform .15s}
.pathstep:hover{border-color:var(--ink);transform:translateY(-2px)}
.pathstep.live{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pathstep .plbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.pathstep b{font-family:var(--f-display);font-size:24px;text-transform:uppercase;line-height:1.1}
.pathstep .ptxt{font-size:15px;color:var(--muted);line-height:1.55}
.pathstep .badge{margin-top:auto}
.path .arrow{align-self:center;font-size:28px;color:var(--muted);font-weight:700}
[dir="rtl"] .path .arrow:not(.plus){transform:scaleX(-1)}
.why{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px}
.whyitem .ico{display:inline-flex;width:48px;height:48px;border-radius:12px;background:var(--accent-soft);color:var(--accent);align-items:center;justify-content:center}
.whyitem .ico svg{width:24px;height:24px}
.whyitem h3{font-size:21px;font-weight:600;text-transform:uppercase;margin:20px 0 8px}
.whyitem p{font-size:15px;line-height:1.6;color:var(--muted)}
.hgallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.hgallery figure{margin:0}
.hgallery img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border-radius:14px}
.hgallery figcaption{font-size:14px;color:var(--muted);margin-top:10px}
.how{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px}
.how li{border-top:3px solid var(--accent);padding-top:20px}
.how .hn{font-family:var(--f-display);font-size:40px;font-weight:700;color:var(--accent);line-height:1}
.how h3{font-size:22px;font-weight:600;text-transform:uppercase;margin:12px 0 8px}
.how p{font-size:15px;line-height:1.6;color:var(--muted)}
.howctas{margin-top:48px;gap:12px}
.faqsec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:32px 64px;align-items:start}
.faq{border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;padding:22px 0;font-weight:600;font-size:17px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:24px;font-weight:400;color:var(--accent);line-height:1;transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding:0 0 24px;color:var(--muted);max-width:62ch;font-size:16px;line-height:1.6}
.ctabox{margin:24px 0 0;border-radius:24px;background:var(--ink);color:#fff;padding:56px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px 40px;align-items:center;scroll-margin-top:16px}
.ctabox .lead{margin-top:12px;color:#c9cfd8;font-size:18px}
.ctabox .contact{grid-column:1/-1;color:#c9cfd8;border-top:1px solid rgba(255,255,255,.15);padding-top:20px}
.ctabox .contact b{color:#fff}
.ctabox .btn:not(.primary){background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.ctabox .btn:not(.primary):hover{border-color:#fff}
#homeBody .creditline{margin:40px 0 0}
@media (max-width:1000px){
  .homehero{grid-template-columns:minmax(0,1fr);grid-template-areas:"text" "img" "facts";gap:40px;padding:48px 0 16px}
  .homehero h2{font-size:46px}
  .who,.faqsec{grid-template-columns:minmax(0,1fr)}
  .why{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hgallery{grid-template-columns:repeat(2,minmax(0,1fr))}
  .path{grid-template-columns:minmax(0,1fr)}
  .path .arrow{transform:rotate(90deg);justify-self:center}
  [dir="rtl"] .path .arrow:not(.plus){transform:rotate(90deg)}
  .how{grid-template-columns:minmax(0,1fr);gap:32px}
  .ctabox{grid-template-columns:minmax(0,1fr);padding:40px}
}
@media (max-width:600px){
  .homehero{padding:28px 0 8px;gap:32px}
  .homehero h2{font-size:38px}
  .homehero .lead{font-size:17px;margin:18px 0 26px}
  .homehero .facts{gap:12px;padding-top:24px}
  .homehero .facts b{font-size:34px}
  .homehero .facts div{font-size:12.5px}
  .hsec{padding:64px 0}
  .hhead{margin-bottom:28px}
  .hhead h2,.who>h2,.faqsec>h2,.ctabox h2{font-size:30px}
  .whotext{font-size:18px}
  .why{grid-template-columns:minmax(0,1fr);gap:32px}
  .hgallery{gap:12px}
  .ctabox{padding:32px 24px;border-radius:20px}
  .howctas .btn,.homehero .ctas .btn{flex:1 1 auto}
}
.kits{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.kitcard{border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;background:var(--page);transition:transform .15s,box-shadow .15s}
.kitcard:hover{transform:translateY(-3px);box-shadow:0 18px 40px -24px rgba(17,24,39,.4)}
.kitcard.live{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.kitcard .pic{aspect-ratio:4/3;background:var(--soft);display:flex;align-items:center;justify-content:center}
.kitcard .pic img{width:100%;height:100%;object-fit:cover;display:block}
.kitcard .pic svg{width:52%;height:auto;color:#9aa3b0}
.kitcard .body{padding:28px;display:flex;flex-direction:column;gap:14px;flex:1}
.kitcard h3{font-size:26px;font-weight:600;text-transform:uppercase}
.kitcard p{font-size:15px;line-height:1.6;color:var(--muted)}
.kitcard .ctas{margin-top:auto;padding-top:8px}
.fromprice{font-size:14px;color:var(--muted)}
.fromprice b{font-family:var(--f-display);font-size:26px;color:var(--ink);margin-inline-start:4px}
.quotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.quotes figure{margin:0;border:1px solid var(--line);border-radius:16px;padding:28px;background:var(--page)}
.quotes blockquote{margin:0 0 16px;font-size:17px;line-height:1.6}
.quotes figcaption{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.quotes figcaption b{color:var(--ink)}
@media (max-width:1000px){.kits{grid-template-columns:minmax(0,1fr)}.kitcard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}.kitcard .pic{aspect-ratio:auto;min-height:100%}}
@media (max-width:600px){.kitcard{display:flex}.kitcard .pic{aspect-ratio:16/10;min-height:0}.kitcard:not(.live) .pic{aspect-ratio:2/1}.kitcard .body{padding:22px}}
.badge{align-self:flex-start;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-radius:999px;padding:2px 10px}
.badge.ok{background:var(--accent-soft);color:var(--accent)}
.badge.soon{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
/* Arduino flat board, simulator and blocks */
.asim{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr);gap:28px;align-items:start;margin-top:24px}
.afhost{position:relative;background:var(--soft);border-radius:var(--radius,18px);padding:12px;box-shadow:var(--shadow-s,0 4px 14px -6px rgba(17,24,39,.1));touch-action:manipulation}
.afhost svg{display:block;width:100%;height:auto}
.afp{cursor:pointer}.afp:hover{filter:brightness(1.15)}
.afp.sel{filter:drop-shadow(0 0 1.2px #4c8dff) drop-shadow(0 0 2.5px #4c8dff)}
.afpress{touch-action:none}
.afledc{fill:#b8231b;transition:fill .08s}
.afledglow{fill:#ff3b2a;opacity:0;pointer-events:none;transition:opacity .08s}
.afglow{opacity:0;pointer-events:none}.afglow.red{fill:#ff3b30}.afglow.blue{fill:#3b7bff}.afglow.on{opacity:.85}
.afbtn{fill:#1fa04a;transition:fill .08s,r .08s}.afbtn.down{fill:#0f6b2e;r:3.8px}
.afrelay{fill:#2a5fd0;stroke:transparent;stroke-width:.8;transition:stroke .1s}.afrelay.on{stroke:#ffc400}
.afpir{fill:none;stroke:#ff8c1a;stroke-width:.7;opacity:0;pointer-events:none}.afpir.on{opacity:1}
.afwaves circle{fill:none;stroke:#f2b33d;stroke-width:.6;opacity:0;pointer-events:none}
.afwaves.on circle{animation:afw .5s linear infinite}.afwaves.on circle+circle{animation-delay:.25s}
@keyframes afw{from{opacity:.9;transform-box:fill-box;transform-origin:center;transform:scale(.7)}to{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(1.15)}}
.aflcd{font-family:var(--f-mono),ui-monospace,Menlo,Consolas,monospace;font-size:6px;fill:#eef3ff;font-weight:600;pointer-events:none}
#afHorn{transition:transform .25s}
.afp text{pointer-events:none;font-family:var(--f-mono),ui-monospace,monospace;font-weight:600}
.a3info{position:absolute;left:18px;right:18px;bottom:18px;z-index:2;background:color-mix(in srgb,var(--page) 94%,transparent);backdrop-filter:blur(8px);border-radius:12px;padding:12px 44px 12px 14px;box-shadow:var(--shadow-s);display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;font-size:14px}
.a3info[hidden]{display:none}
.a3info b{font-size:15px}.a3info i{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--accent)}.a3info span{flex-basis:100%;color:var(--muted)}
.a3info .ib{position:absolute;top:6px;right:6px;border:0;background:transparent;font-size:22px;line-height:1;width:32px;height:32px;border-radius:8px;cursor:pointer;color:var(--muted)}
.axpanel{display:flex;flex-direction:column;gap:12px;min-width:0}
.axpanel h4,.abhead h4{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:8px 0 0}
.axbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.axsel{display:flex;flex-direction:column;gap:4px;flex:1 1 200px;min-width:0;font-size:13px;color:var(--muted)}
.axsel select{width:100%;font-size:15px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--page);color:var(--ink)}
.axstate{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:4px 10px;border-radius:999px;background:var(--soft);align-self:center}
.axstate.on{color:#0f7a3f;background:#e3f6ea}.axstate.err{color:var(--bad);background:#fdecec;text-transform:none;letter-spacing:0}
.axdesc{font-size:14.5px;color:var(--muted);margin:0}
.axlcd{background:#2e4fd8;border:6px solid #1c1f25;border-radius:8px;padding:8px 10px;font-family:var(--f-mono);font-size:clamp(14px,2.1vw,19px);letter-spacing:.08em;color:#eef3ff;white-space:pre;overflow:hidden;line-height:1.35;box-shadow:inset 0 0 18px rgba(0,0,0,.25)}
.axouts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.aout{background:var(--soft);border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.aout span{color:var(--muted);flex:1;min-width:0}.aout b{font-variant-numeric:tabular-nums}
.lbar{flex:0 0 46px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}.lbar i{display:block;height:100%;background:#e5332a}
.apill{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--line);white-space:nowrap}.apill.hot{background:#ffe2a8;color:#7a4a00}
.axins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.asl{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.asl input{width:100%;accent-color:var(--accent)}
.axtog{font-size:13px;grid-column:1/-1}
#axBtn{width:100%;justify-content:center;white-space:normal;text-align:center;user-select:none;-webkit-user-select:none;touch-action:none}
#axBtn.down{background:var(--accent);color:#fff;border-color:var(--accent)}
.axchk{display:flex;align-items:center;gap:8px;font-size:13.5px}
.axremote{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.axremote .keys{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;max-width:320px}
.key{border:1px solid var(--line);background:var(--page);border-radius:8px;padding:6px 0;font-weight:700;font-family:var(--f-mono);cursor:pointer}
.key:hover{border-color:var(--accent);color:var(--accent)}
.axserial{background:#111827;color:#9ae6b4;font-family:var(--f-mono);font-size:12.5px;border-radius:10px;padding:10px 12px;min-height:5.4em;max-height:9em;overflow:auto;margin:0}
.axcode{margin-top:20px;border:1px solid var(--line);border-radius:14px;padding:4px 16px}
.axcode summary{cursor:pointer;padding:10px 0;font-weight:600}
.axcode pre{background:#0f1729;color:#dbe4ff;font-family:var(--f-mono);font-size:13px;line-height:1.55;border-radius:10px;padding:14px 16px;overflow:auto;margin:0 0 12px;max-height:520px}
/* Scratch-style blocks */
.abwrap{margin-top:28px}
.abhead .gnote{margin-top:4px}
.abed{display:grid;grid-template-columns:minmax(230px,300px) minmax(0,1fr);gap:16px;margin-top:12px;align-items:start}
.bpal{display:flex;flex-direction:column;gap:14px;max-height:640px;overflow:auto;padding:12px;background:var(--soft);border-radius:14px}
.bcat{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.bcatt{font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:0;display:flex;align-items:center;gap:6px}
.bcatt::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--bc)}
.bnote{font-size:12px;color:var(--muted);margin:0;line-height:1.45}.berr{color:var(--bad)}
.bscript{background:var(--page);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:320px;display:flex;flex-direction:column;gap:18px;overflow-x:auto;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:18px 18px}
.cat-ctl{--bc:#ffab19;--bd:#cf8b17}.cat-out{--bc:#4c97ff;--bd:#3373cc}.cat-lcd{--bc:#9966ff;--bd:#774dcb}.cat-in{--bc:#2ea9cf;--bd:#2e8eb8}.cat-op{--bc:#40b65a;--bd:#389438}.cat-var{--bc:#ff8c1a;--bd:#db6e00}
.blk{display:inline-flex;flex-direction:column;align-self:flex-start;background:var(--bc);color:#fff;border-radius:8px;border:1px solid var(--bd);box-shadow:0 2px 0 var(--bd);font-size:14px;font-weight:600;min-width:120px;max-width:100%;position:relative}
.blk.pv{cursor:pointer;font-family:inherit;text-align:start;padding:0}
.blk.pv:disabled{opacity:.45;cursor:not-allowed}
.blk.pv:hover:not(:disabled){filter:brightness(1.07)}
.bkh{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 10px;min-height:34px}
.bt{white-space:nowrap}

/* ---------- polish: more air, softer surfaces, gentle motion (2026-11-17) ---------- */
:root{--radius:22px;--shadow-s:0 1px 2px rgba(17,24,39,.05),0 4px 14px -6px rgba(17,24,39,.10);--shadow-l:0 2px 4px rgba(17,24,39,.04),0 24px 48px -20px rgba(17,24,39,.28);--ease:cubic-bezier(.2,.7,.2,1)}
html{scroll-behavior:smooth}
.btn{transition:transform .18s var(--ease),box-shadow .18s var(--ease),background-color .18s,border-color .18s,color .18s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{box-shadow:0 6px 16px -8px color-mix(in srgb,var(--accent) 80%,transparent)}
.btn.primary:hover{box-shadow:0 10px 24px -10px color-mix(in srgb,var(--accent) 90%,transparent)}
.btn:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
/* sticky header on the home and kit pages */
body:not([data-view="cpu"]) header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--page) 86%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);border-bottom-color:transparent;transition:border-color .2s,box-shadow .2s}
body.scrolled:not([data-view="cpu"]) header.top{border-bottom-color:var(--line);box-shadow:0 0 0 100vmax color-mix(in srgb,var(--page) 86%,transparent);clip-path:inset(0 -100vmax -1px)}
/* hero */
#view-home{overflow-x:clip}
.homehero{position:relative;padding:104px 0 40px;gap:56px 80px}
.homehero::before{content:"";position:absolute;z-index:-1;inset-inline-end:2%;top:10%;width:50%;aspect-ratio:1;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 13%,transparent),transparent 72%);pointer-events:none}
.homehero h2{font-size:clamp(46px,6vw,76px);line-height:.96;letter-spacing:-.005em;margin-top:24px}
.homehero h2 + .lead{margin:28px 0 40px}
.homehero .facts{padding-top:40px;margin-top:16px}
.homehero .facts b{font-size:52px}
.heroimg img{filter:drop-shadow(0 30px 40px rgba(17,24,39,.18))}
/* sections */
.hsec{padding:128px 0}
.hhead{margin-bottom:56px}
.hhead h2,.who>h2,.faqsec>h2,.ctabox h2{font-size:clamp(32px,3.6vw,48px);letter-spacing:-.005em}
.hhead .lead{margin-top:18px;font-size:19px}
.hsec+.hsec:not(.band){border-top:none}
.band{background:var(--soft)}
.whotext{font-size:23px;line-height:1.65}
/* cards */
.kits{gap:32px}
.kitcard{border-radius:var(--radius);border-color:transparent;box-shadow:var(--shadow-s);transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.kitcard:hover{transform:translateY(-6px);box-shadow:var(--shadow-l)}
.kitcard.live{box-shadow:0 0 0 2px var(--accent),var(--shadow-s)}
.kitcard.live:hover{box-shadow:0 0 0 2px var(--accent),var(--shadow-l)}
.kitcard .pic{overflow:hidden}
.kitcard .pic > *{transition:transform .6s var(--ease)}
.kitcard:hover .pic > *{transform:scale(1.035)}
.kitcard .body{padding:32px}
.path{gap:24px}
.pathstep{border-radius:var(--radius);border-color:transparent;box-shadow:var(--shadow-s);padding:30px;transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.pathstep:hover{transform:translateY(-4px);box-shadow:var(--shadow-l);border-color:transparent}
.pathstep.live{box-shadow:0 0 0 2px var(--accent),var(--shadow-s)}
.why{gap:48px}
.whyitem .ico{width:56px;height:56px;border-radius:16px;transition:transform .35s var(--ease),background-color .25s,color .25s}
.whyitem:hover .ico{transform:translateY(-3px) rotate(-4deg);background:var(--accent);color:#fff}
.hgallery{gap:24px}
.hgallery .bdraw{border-color:transparent;box-shadow:var(--shadow-s);border-radius:18px;transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.hgallery figure:hover .bdraw{transform:translateY(-4px);box-shadow:var(--shadow-l)}
.how{gap:56px}
.faq summary{padding:26px 0;transition:color .15s}
.faq summary:hover{color:var(--accent)}
.ctabox{border-radius:28px;padding:72px;margin-top:40px;position:relative;overflow:hidden;isolation:isolate}
.ctabox::after{content:"";position:absolute;z-index:-1;inset-inline-end:-120px;top:-160px;width:420px;aspect-ratio:1;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 55%,transparent),transparent);opacity:.55;pointer-events:none}
/* kit pages */
#soonBody{padding:56px 0 32px}
.ghead{margin:24px 0 40px}
.ghead h2,.soonpage h2{font-size:clamp(34px,4.4vw,56px);line-height:1}
.gboard{border-color:transparent;box-shadow:var(--shadow-s);border-radius:var(--radius);padding:18px}
.gcols{margin:72px 0 24px;gap:40px}
.gcta{margin-top:72px}
.gtt{transition:opacity .25s,border-color .25s,transform .25s var(--ease)}
.gtt.used{transform:translateY(-2px);box-shadow:var(--shadow-s)}
.gwire{transition:stroke .2s}
@keyframes wireIn{from{stroke-dashoffset:var(--len,400)}to{stroke-dashoffset:0}}
/* page change */
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.anim body:not([data-view="cpu"]) .view.active{animation:viewIn .45s var(--ease) both}
/* hero entrance */
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.anim .herotext > *{animation:up .7s var(--ease) both}
.anim .herotext > :nth-child(2){animation-delay:.08s}.anim .herotext > :nth-child(3){animation-delay:.16s}.anim .herotext > :nth-child(4){animation-delay:.24s}
.anim .heroimg{animation:up .9s .15s var(--ease) both}
.anim .heroimg img{animation:floaty 7s 1.2s ease-in-out infinite}
/* scroll reveal: only when the script runs and motion is allowed */
.anim .rv{opacity:0;transform:translateY(28px);transition:opacity .7s var(--ease) var(--d,0ms),transform .7s var(--ease) var(--d,0ms)}
.anim .rv.in{opacity:1;transform:none}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
.anim .path .arrow:not(.plus){animation:nudge 2.4s ease-in-out infinite}
[dir="rtl"].anim .path .arrow:not(.plus),.anim [dir="rtl"] .path .arrow:not(.plus){animation:none}
.faq details[open] p{animation:up .35s var(--ease) both}
@media (max-width:1000px){
  .homehero{padding:56px 0 24px}
  .homehero::before{display:none}
  .hsec{padding:96px 0}
  .ctabox{padding:48px}
  .anim .path .arrow:not(.plus){animation:none}
}

  .kitcard .body{padding:24px}
  .ctabox{padding:36px 24px;border-radius:22px}
  .gcols{margin:48px 0 16px}
}

 hWhoP:["We are two Algerian electronics engineers, working with the Incubateur de l'Université de Bouira. We think students understand electronics best when they hold it in their hands: when they see the signal on an LED, wire the board, and fix it when it doesn't work. So we design teaching kits that are built to be opened, studied and repaired, and we write the lessons that go with them.","Nous sommes deux ingénieurs algériens en électronique, accompagnés par l'Incubateur de l'Université de Bouira. Nous pensons qu'on comprend le mieux l'électronique en la tenant en main : en voyant le signal sur une LED, en câblant la carte et en la réparant quand elle ne marche pas. Nous concevons donc des kits pédagogiques faits pour être ouverts, étudiés et réparés, avec les cours qui les accompagnent.","نحن مهندسان جزائريان في الإلكترونيات، نعمل مع حاضنة جامعة البويرة. نؤمن أن الطالب يفهم الإلكترونيات أفضل حين يمسكها بيديه: حين يرى الإشارة على مصباح LED، ويوصل البطاقة، ويصلحها حين لا تعمل. لذلك نصمّم أطقماً تعليمية صُنعت لتُفتح وتُدرس وتُصلح، ونكتب الدروس التي ترافقها."],

`<div class="prose">
<h2>User guide</h2>
<p class="lead">How to set up the kit, enter a program by hand, run it and read what the LEDs tell you.</p>
<h3>1. What is in the kit</h3>
<p>One backplane and ten cards: Clock, Register A, Register B, Instruction Register, ALU, Program Counter, Memory Address Register, RAM, Output and Control. Register A, Register B and the Instruction Register are three copies of the same card. One backplane position is spare.</p>
<h3>2. Assemble</h3>
<ol>
<li>Lay the backplane flat. Connect each card to the headers beside its name, plugged directly or through short ribbon cables as in the photos: Clock, MAR, RAM, Instruction Register and Control on one side; Program Counter, Register A, ALU, Register B and Output on the other.</li>
<li>Fit the four cables that do not go through the backplane: Register A to the ALU (8 wires), Register B to the ALU (8 wires), MAR to RAM (address and Program line, 5 wires), Instruction Register upper four bits to Control (4 wires).</li>
<li>Seat the two microcode EEPROMs in the Control card and the display EEPROM in the Output card.</li>
<li>Connect a 5 V USB-C supply to the backplane.</li>
</ol>
<div class="callout">Check for shorts between +5 V and GND with a multimeter before the first power-up, and connect or remove cards only with the power off.</div>
<h3>3. Enter a program by hand</h3>
<p>You can rehearse every step below on the simulator: the switches and buttons on the drawn boards work.</p>
<ol>
<li>Set the Clock card to <b>Manual</b> so nothing runs while you type.</li>
<li>Set the Run/Prog switch on the MAR card to <b>Prog</b>. The MAR and RAM now listen to the DIP switches instead of the bus.</li>
<li>Set the address on the 4-way DIP switch. Confirm it on the four address LEDs.</li>
<li>Set the byte on the 8-way DIP switch on the RAM card.</li>
<li>Press the write button on the RAM card. The eight RAM LEDs should now show your byte.</li>
<li>Repeat for every address you use, then set the switch back to <b>Run</b>.</li>
<li>Press <b>Reset</b> on the Control card. The program counter and step counter return to zero.</li>
</ol>
<p>In the simulator's Program tab, <b>Copy as switch list</b> gives the 16 bytes of any program as address and data switch settings.</p>
<h3>4. Run it</h3>
<ul>
<li><b>Single step:</b> leave the clock on Manual and press the pulse button. Each press is one clock pulse, the same as <b>Clock pulse</b> in the simulator. Compare the LEDs with the simulator after each press.</li>
<li><b>Free run:</b> switch the clock to Continuous and set the speed with the potentiometer.</li>
<li><b>Halt:</b> a <code>HLT</code> instruction stops the clock. Press Reset to start again.</li>
</ul>
<h3>5. Read the machine</h3>
<p>Every instruction takes six clock pulses, T0 to T5. T0 and T1 fetch the instruction, the same way every time. T2 onward carry it out. Unused steps do nothing.</p>
<p>On each pulse, at most one card drives the bus and one or more cards store what is on it. The 16 control LEDs on the Control card show which. If two cards ever drive the bus at once, the microcode EEPROMs are wrong or a card is connected to the wrong position.</p>
<h3>6. If it does not work</h3>
<ul>
<li><b>Nothing lights:</b> check the USB-C supply and the VCC and GND pins on any header.</li>
<li><b>Step LEDs do not advance:</b> check the Clock card output LED, then the Halt LED on Control.</li>
<li><b>Fetch works but the wrong thing executes:</b> check the 4-wire cable from the Instruction Register to Control, then reprogram the microcode EEPROMs.</li>
<li><b>RAM reads back wrong:</b> re-enter the byte in Prog mode and watch the RAM LEDs while you press write.</li>
<li><b>Sum is wrong by a fixed pattern:</b> one of the two 8-wire ALU cables is shifted or reversed.</li>
</ul>
<h3>Simulator shortcuts</h3>
<p><kbd>Space</kbd> clock pulse · <kbd>Enter</kbd> one instruction · <kbd>R</kbd> run or pause · <kbd>Backspace</kbd> step back · <kbd>Esc</kbd> whole computer</p>
</div>`,

`<div class="prose">
<h2>Guide d'utilisation</h2>
<p class="lead">Comment monter le kit, saisir un programme à la main, l'exécuter et lire ce qu'indiquent les LED.</p>
<h3>1. Contenu du kit</h3>
<p>Un fond de panier et dix cartes : Horloge, Registre A, Registre B, Registre d'instruction, UAL, Compteur ordinal, Registre d'adresse mémoire (MAR), RAM, Sortie et Commande. Le registre A, le registre B et le registre d'instruction sont trois exemplaires de la même carte. Un emplacement du fond de panier reste libre.</p>
<h3>2. Montage</h3>
<ol>
<li>Posez le fond de panier à plat. Reliez chaque carte aux connecteurs situés près de son nom, directement ou par de courtes nappes comme sur les photos : Horloge, MAR, RAM, Registre d'instruction et Commande d'un côté ; Compteur ordinal, Registre A, UAL, Registre B et Sortie de l'autre.</li>
<li>Installez les quatre câbles qui ne passent pas par le fond de panier : Registre A vers l'UAL (8 fils), Registre B vers l'UAL (8 fils), MAR vers la RAM (adresse et ligne Program, 5 fils), quatre bits de poids fort du Registre d'instruction vers la Commande (4 fils).</li>
<li>Insérez les deux EEPROM de microcode sur la carte Commande et l'EEPROM d'affichage sur la carte Sortie.</li>
<li>Branchez une alimentation USB-C 5 V sur le fond de panier.</li>
</ol>
<div class="callout">Vérifiez au multimètre l'absence de court-circuit entre +5 V et GND avant la première mise sous tension, et ne branchez ou retirez les cartes que hors tension.</div>
<h3>3. Saisir un programme à la main</h3>
<p>Vous pouvez répéter chaque étape sur le simulateur : les interrupteurs et boutons des cartes dessinées fonctionnent.</p>
<ol>
<li>Mettez la carte Horloge sur <b>Manual</b> pour que rien ne s'exécute pendant la saisie.</li>
<li>Mettez l'interrupteur Run/Prog de la carte MAR sur <b>Prog</b>. Le MAR et la RAM suivent alors les interrupteurs DIP au lieu du bus.</li>
<li>Réglez l'adresse sur l'interrupteur DIP à 4 voies. Vérifiez-la sur les quatre LED d'adresse.</li>
<li>Réglez l'octet sur l'interrupteur DIP à 8 voies de la carte RAM.</li>
<li>Appuyez sur le bouton d'écriture de la carte RAM. Les huit LED de la RAM doivent afficher votre octet.</li>
<li>Recommencez pour chaque adresse utilisée, puis remettez l'interrupteur sur <b>Run</b>.</li>
<li>Appuyez sur <b>Reset</b> sur la carte Commande. Le compteur ordinal et le compteur d'étapes reviennent à zéro.</li>
</ol>
<p>Dans l'onglet Programme du simulateur, <b>Copier la liste d'interrupteurs</b> donne les 16 octets d'un programme sous forme de positions d'interrupteurs d'adresse et de donnée.</p>
<h3>4. Exécuter</h3>
<ul>
<li><b>Pas à pas :</b> laissez l'horloge sur Manual et appuyez sur le bouton d'impulsion. Chaque appui est une impulsion d'horloge, comme <b>Impulsion d'horloge</b> dans le simulateur. Comparez les LED avec le simulateur après chaque appui.</li>
<li><b>Exécution continue :</b> passez l'horloge sur Continuous et réglez la vitesse avec le potentiomètre.</li>
<li><b>Arrêt :</b> une instruction <code>HLT</code> arrête l'horloge. Appuyez sur Reset pour recommencer.</li>
</ul>
<h3>5. Lire la machine</h3>
<p>Chaque instruction prend six impulsions d'horloge, de T0 à T5. T0 et T1 recherchent l'instruction, toujours de la même façon. À partir de T2, elle est exécutée. Les étapes inutilisées ne font rien.</p>
<p>À chaque impulsion, au plus une carte pilote le bus et une ou plusieurs cartes mémorisent son contenu. Les 16 LED de la carte Commande indiquent lesquelles. Si deux cartes pilotent le bus en même temps, les EEPROM de microcode sont erronées ou une carte est branchée au mauvais emplacement.</p>
<h3>6. En cas de problème</h3>
<ul>
<li><b>Rien ne s'allume :</b> vérifiez l'alimentation USB-C et les broches VCC et GND d'un connecteur.</li>
<li><b>Les LED d'étape n'avancent pas :</b> vérifiez la LED de sortie de la carte Horloge, puis la LED Halt de la Commande.</li>
<li><b>La recherche fonctionne mais l'exécution est fausse :</b> vérifiez le câble 4 fils du Registre d'instruction vers la Commande, puis reprogrammez les EEPROM de microcode.</li>
<li><b>La RAM relit une mauvaise valeur :</b> ressaisissez l'octet en mode Prog et observez les LED de la RAM pendant l'appui sur le bouton d'écriture.</li>
<li><b>La somme est fausse de façon régulière :</b> un des deux câbles 8 fils de l'UAL est décalé ou inversé.</li>
</ul>
<h3>Raccourcis du simulateur</h3>
<p><kbd>Espace</kbd> impulsion d'horloge · <kbd>Entrée</kbd> une instruction · <kbd>R</kbd> lancer ou mettre en pause · <kbd>Retour arrière</kbd> reculer · <kbd>Échap</kbd> vue d'ensemble</p>
</div>`,

`<div class="prose">
<h2>دليل الاستعمال</h2>
<p class="lead">كيف تركّب الطقم، تُدخل برنامجاً يدوياً، تشغّله، وتقرأ ما تخبرك به المصابيح.</p>
<h3>1. محتوى الطقم</h3>
<p>لوحة خلفية واحدة وعشر بطاقات: الساعة، المسجّل A، المسجّل B، مسجّل التعليمة، وحدة الحساب والمنطق، عدّاد البرنامج، مسجّل عنوان الذاكرة (MAR)، الذاكرة RAM، الإخراج، والتحكم. المسجّل A والمسجّل B ومسجّل التعليمة ثلاث نسخ من البطاقة نفسها. يبقى موضع واحد شاغراً على اللوحة الخلفية.</p>
<h3>2. التركيب</h3>
<ol>
<li>ضع اللوحة الخلفية مسطّحة. صِل كل بطاقة بالموصلات المجاورة لاسمها، مباشرة أو بأشرطة أسلاك قصيرة كما في الصور: الساعة و MAR و RAM ومسجّل التعليمة والتحكم في جهة؛ عدّاد البرنامج والمسجّل A ووحدة الحساب والمسجّل B والإخراج في الجهة الأخرى.</li>
<li>ركّب الكوابل الأربعة التي لا تمرّ عبر اللوحة الخلفية: من المسجّل A إلى وحدة الحساب (8 أسلاك)، من المسجّل B إلى وحدة الحساب (8 أسلاك)، من MAR إلى RAM (العنوان وخط Program، 5 أسلاك)، والبتات الأربعة العليا من مسجّل التعليمة إلى التحكم (4 أسلاك).</li>
<li>ثبّت ذاكرتَي EEPROM للشيفرة المصغّرة في بطاقة التحكم وذاكرة EEPROM للعرض في بطاقة الإخراج.</li>
<li>صِل تغذية USB-C بجهد 5 فولت باللوحة الخلفية.</li>
</ol>
<div class="callout">تحقّق بمقياس متعدد من عدم وجود قصر بين +5V و GND قبل أول تشغيل، ولا تصل البطاقات أو تنزعها إلا والتغذية مقطوعة.</div>
<h3>3. إدخال برنامج يدوياً</h3>
<p>يمكنك التدرّب على كل خطوة في المحاكي: المفاتيح والأزرار على البطاقات المرسومة تعمل.</p>
<ol>
<li>ضع بطاقة الساعة على <b>Manual</b> حتى لا يعمل شيء أثناء الإدخال.</li>
<li>ضع مفتاح Run/Prog على بطاقة MAR على <b>Prog</b>. عندها يتبع MAR و RAM مفاتيح DIP بدل الناقل.</li>
<li>اضبط العنوان على مفاتيح DIP الأربعة. تأكّد منه على مصابيح العنوان الأربعة.</li>
<li>اضبط البايت على مفاتيح DIP الثمانية في بطاقة RAM.</li>
<li>اضغط زر الكتابة على بطاقة RAM. يجب أن تُظهر مصابيح RAM الثمانية البايت الذي أدخلته.</li>
<li>كرّر ذلك لكل عنوان تستعمله، ثم أعد المفتاح إلى <b>Run</b>.</li>
<li>اضغط <b>Reset</b> على بطاقة التحكم. يعود عدّاد البرنامج وعدّاد الخطوات إلى الصفر.</li>
</ol>
<p>في تبويب البرنامج بالمحاكي، يعطيك زر <b>نسخ كقائمة مفاتيح</b> البايتات الستة عشر لأي برنامج على شكل أوضاع مفاتيح العنوان والمعطى.</p>
<h3>4. التشغيل</h3>
<ul>
<li><b>خطوة بخطوة:</b> اترك الساعة على Manual واضغط زر النبضة. كل ضغطة نبضة ساعة واحدة، مثل زر <b>نبضة ساعة</b> في المحاكي. قارن المصابيح بالمحاكي بعد كل ضغطة.</li>
<li><b>تشغيل مستمر:</b> حوّل الساعة إلى Continuous واضبط السرعة بمقاومة التعديل.</li>
<li><b>التوقف:</b> تعليمة <code>HLT</code> توقف الساعة. اضغط Reset للبدء من جديد.</li>
</ul>
<h3>5. قراءة الآلة</h3>
<p>كل تعليمة تستغرق ست نبضات ساعة، من T0 إلى T5. في T0 و T1 تُجلَب التعليمة بالطريقة نفسها دائماً. ابتداءً من T2 تُنفَّذ. الخطوات غير المستعملة لا تفعل شيئاً.</p>
<p>في كل نبضة، بطاقة واحدة على الأكثر تقود الناقل، وبطاقة أو أكثر تخزّن ما عليه. مصابيح التحكم الستة عشر على بطاقة التحكم تبيّن أيّها. إذا قادت بطاقتان الناقل في الوقت نفسه فذاكرتا EEPROM للشيفرة المصغّرة خاطئتان أو بطاقة موصولة في غير موضعها.</p>
<h3>6. إذا لم يعمل</h3>
<ul>
<li><b>لا شيء يضيء:</b> تحقّق من تغذية USB-C ومن دبابيس VCC و GND في أي موصل.</li>
<li><b>مصابيح الخطوات لا تتقدم:</b> تحقّق من مصباح مخرج بطاقة الساعة، ثم مصباح Halt في بطاقة التحكم.</li>
<li><b>الجلب يعمل لكن التنفيذ خاطئ:</b> تحقّق من الكابل ذي الأسلاك الأربعة من مسجّل التعليمة إلى التحكم، ثم أعد برمجة ذاكرتَي EEPROM.</li>
<li><b>الذاكرة تعيد قيمة خاطئة:</b> أعد إدخال البايت في وضع Prog وراقب مصابيح RAM أثناء ضغط زر الكتابة.</li>
<li><b>المجموع خاطئ بنمط ثابت:</b> أحد كابلَي وحدة الحساب ذوَي الأسلاك الثمانية مُزاح أو معكوس.</li>
</ul>
<h3>اختصارات المحاكي</h3>
<p><kbd>Space</kbd> نبضة ساعة · <kbd>Enter</kbd> تعليمة واحدة · <kbd>R</kbd> تشغيل أو إيقاف مؤقت · <kbd>Backspace</kbd> خطوة للخلف · <kbd>Esc</kbd> الحاسوب كاملاً</p>

/*CORE-START*/
const S={PCO:1,SUB:2,FI:4,JMP:8,HLT:16,PCE:32,AI:64,AO:128,OUT:256,BI:512,EO:1024,IO:2048,II:4096,RI:8192,RO:16384,MI:32768};
const OPS={0:"NOP",1:"LDA",2:"STA",3:"LDB",4:"ADD",5:"SUB",6:"JMP",7:"JMPC",8:"JMPZ",14:"OUT",15:"HLT"};
const HAS_ARG={LDA:1,STA:1,LDB:1,JMP:1,JMPC:1,JMPZ:1};
const MNEM={};for(const k in OPS)MNEM[OPS[k]]=+k;MNEM.HALT=15;MNEM.JC=7;MNEM.JZ=8;MNEM.NOOP=0;
function microcode(op,step,cf,zf){
  if(step===0)return S.MI|S.PCO;
  if(step===1)return S.RO|S.II|S.PCE;
  const jmp=[S.IO|S.JMP];
  const t={1:[S.IO|S.MI,S.RO|S.AI],2:[S.IO|S.MI,S.AO|S.RI],3:[S.IO|S.MI,S.RO|S.BI],
    4:[S.IO|S.MI,S.EO|S.AI|S.FI],5:[S.IO|S.MI,S.EO|S.SUB|S.AI|S.FI],6:jmp,
    7:cf?jmp:[],8:zf?jmp:[],14:[S.AO|S.OUT],15:[S.HLT]}[op]||[];
  return t[step-2]||0;
}
function newState(ram){return{pc:0,mar:0,ir:0,a:0,b:0,out:0,cf:0,zf:0,step:0,halted:false,ticks:0,ram:ram?ram.slice():new Array(16).fill(0)};}
const rev8=v=>{let r=0;for(let i=0;i<8;i++)r=(r<<1)|((v>>i)&1);return r;};
function aluIn(st){let a=st.a,b=st.b;if(st.fault==="aRev")a=rev8(a);if(st.fault==="bShift")b=(b<<1)&255;return[a,b];}
function ramOut(st,ad){const v=st.ram[ad];return st.fault==="ram7"?v&127:v;}
function alu(st,cw){const[a,b]=aluIn(st);const sub=cw&S.SUB?1:0;const bb=sub?(~b&255):b;const sum=a+bb+sub;return{res:sum&255,c:sum>255?1:0,z:(sum&255)===0?1:0,sub};}
function view(st){ // cw: what the Control card drives (its LEDs); eff: what actually reaches the cards
  let op=st.ir>>4;if(st.fault==="op0")op&=14;
  const cw=microcode(op,st.step,st.cf,st.zf);let eff=cw;
  if(st.fault==="fiDead")eff&=~S.FI;if(st.fault==="biDead")eff&=~S.BI;if(st.fault==="jmpDead")eff&=~S.JMP;
  const al=alu(st,cw);
  let bus=0,src=null;
  if(cw&S.PCO){bus=st.pc;src="pc";}
  if(cw&S.RO){bus=ramOut(st,st.mar);src="ram";}
  if(cw&S.IO){bus=st.ir;src="ir";}
  if(cw&S.AO){bus=st.a;src="a";}
  if(cw&S.EO){bus=al.res;src="alu";}
  if(st.fault==="bFloat"){if(src)bus|=st.b;else{bus=st.b;src="b";}} // B's output enable floats: B always drives the bus
  return{cw,eff,bus,src,al};
}
function tick(st){
  if(st.halted)return st;
  const {eff:cw,bus,al}=view(st);
  if(cw&S.HLT){st.halted=true;return st;}
  if(cw&S.RI)st.ram[st.mar]=bus;
  if(cw&S.MI)st.mar=st.fault==="marMix"?(bus&12)|((typeof dipA==="number"?dipA:0)&3):bus&15; // wrong selector footprint
  if(cw&S.II)st.ir=bus;
  if(cw&S.FI){st.cf=al.c;st.zf=al.z;}
  if(cw&S.AI)st.a=bus;
  if(cw&S.BI)st.b=bus;
  if(cw&S.OUT)st.out=bus;
  if(cw&S.PCE)st.pc=(st.pc+1)&15;
  if(cw&S.JMP)st.pc=bus&15;
  st.step=(st.step+1)%6;st.ticks++;
  return st;
}
function num(t){
  if(/^0b[01]+$/i.test(t))return parseInt(t.slice(2),2);
  if(/^0x[0-9a-f]+$/i.test(t))return parseInt(t,16);
  if(/^\d+$/.test(t))return parseInt(t,10);
  return NaN;
}
function assemble(src){ // errors come back as {line, code, args} so the page can word them in any language
  const ram=new Array(16).fill(0),used={},labels={},items=[];let addr=0;
  const E=(line,code,...args)=>({error:{line,code,args}});
  const lines=src.split(/\r?\n/);
  for(let i=0;i<lines.length;i++){
    let l=lines[i].replace(/[;#].*$/,"").trim();if(!l)continue;
    let m;
    while((m=l.match(/^([^:\s]+)\s*:\s*(.*)$/))){
      const a=num(m[1]);
      if(!isNaN(a)){if(a>15)return E(i+1,"aAddr");addr=a;}
      else if(/^[A-Za-z_]\w*$/.test(m[1])){const k=m[1].toLowerCase();if(k.toUpperCase() in MNEM)return E(i+1,"aLabIns",m[1]);if(k in labels)return E(i+1,"aLabTwice",m[1]);labels[k]=addr;}
      else return E(i+1,"aNotAddr",m[1]);
      l=m[2].trim();
    }
    if(!l)continue;
    if(addr>15)return E(i+1,"aPast");
    if(used[addr])return E(i+1,"aUsed",addr,used[addr]);
    used[addr]=i+1;items.push({addr,l,line:i+1});addr++;
  }
  for(const it of items){
    const p=it.l.split(/\s+/);let byte;
    const n=num(p[0]);
    if(!isNaN(n)){if(n>255)return E(it.line,"aData");if(p.length>1)return E(it.line,"aExtra");byte=n;}
    else{
      const name=p[0].toUpperCase();if(!(name in MNEM))return E(it.line,"aUnknown",p[0]);
      const canon=OPS[MNEM[name]];let arg=0;
      if(HAS_ARG[canon]){
        if(p.length<2)return E(it.line,"aNeed",canon);
        arg=num(p[1]);if(isNaN(arg)&&p[1].toLowerCase() in labels)arg=labels[p[1].toLowerCase()];
        if(isNaN(arg))return E(it.line,"aNotKnown",p[1]);
        if(arg>15)return E(it.line,"aNeed",canon);
      }else if(p.length>1)return E(it.line,"aNoArg",canon);
      byte=(MNEM[name]<<4)|arg;
    }
    ram[it.addr]=byte;
  }
  return{ram,count:items.length};
}
function disasm(b){const n=OPS[b>>4];if(!n)return"";return HAS_ARG[n]?n+" "+(b&15):n;}
function runProgram(ram,max){
  const st=newState(ram),outs=[];
  for(let i=0;i<max&&!st.halted;i++){const v=view(st);tick(st);if(v.cw&S.OUT)outs.push(st.out);}
  return{st,outs};
}

function ledDef(inst,ref){
  const n=+ref.slice(1);
  switch(inst){
    case"bus":return["bus",n-1,""];
    case"alu":return n<=8?["alu",8-n,"g"]:n===9?["cf",0,"b"]:["zf",0,"b"];
    case"clk":return n===1?["ast",0,"y"]:n===2?["man",0,"y"]:["clk",0,"b"];
    case"ctl":if(n>=17)return["T",n-17,""];
      return["cw",[0,S.HLT,S.MI,S.AI,S.AO,S.II,S.IO,S.BI,S.JMP,S.PCO,S.PCE,S.RI,S.RO,S.EO,S.SUB,S.FI,S.OUT][n],"b"];
    case"mar":return["mar",4-n,""];
    case"pc":return["pc",4-n,"g"];
    case"ram":return["ramv",8-n,""];
    case"a":case"b":case"ir":return[inst,n-1,n>4?"b":""];
  }
  return null;
}
function bbox(p){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(let i=0;i<p.length;i+=2){x0=Math.min(x0,p[i]);x1=Math.max(x1,p[i]);y0=Math.min(y0,p[i+1]);y1=Math.max(y1,p[i+1]);}return{x0,y0,x1,y1,cx:(x0+x1)/2,cy:(y0+y1)/2,w:x1-x0,h:y1-y0};}
function silkText(tx){
  const[txt,x,y,rot,sz,j]=tx;const fs=(sz*1.25).toFixed(2);const lines=txt.split("\n");
  const anchor=j==="s"?"start":j==="e"?"end":"middle";
  const fmt=s=>esc(s).replace(/~\{([^}]*)\}/g,'<tspan text-decoration="overline">$1</tspan>');
  const y0=y-(lines.length-1)*sz*0.75;
  return'<text class="silk" font-size="'+fs+'" text-anchor="'+anchor+'" transform="rotate('+(-rot)+" "+x+" "+y+')">'+
    lines.map((l,i)=>'<tspan x="'+x+'" y="'+(y0+i*sz*1.5+sz*0.42).toFixed(2)+'">'+fmt(l)+"</tspan>").join("")+"</text>";
}
function sevenSeg(x,y,w,h,id){
  const tt=h*0.1,g=tt*0.25,L=x,R=x+w,T=y,M=y+h/2,B=y+h;
  const hz=(xa,xb,yc)=>`${xa+g},${yc} ${xa+g+tt/2},${yc-tt/2} ${xb-g-tt/2},${yc-tt/2} ${xb-g},${yc} ${xb-g-tt/2},${yc+tt/2} ${xa+g+tt/2},${yc+tt/2}`;
  const vt=(xc,ya,yb)=>`${xc},${ya+g} ${xc+tt/2},${ya+g+tt/2} ${xc+tt/2},${yb-g-tt/2} ${xc},${yb-g} ${xc-tt/2},${yb-g-tt/2} ${xc-tt/2},${ya+g+tt/2}`;
  const segs=[hz(L,R,T),vt(R,T,M),vt(R,M,B),hz(L,R,B),vt(L,M,B),vt(L,T,M),hz(L,R,M)];
  return segs.map((p,i)=>'<polygon class="seg" id="'+id+"-"+i+'" points="'+p+'"/>').join("");
}

/* ---------- gentle motion: reveal blocks as they scroll in, count the hero facts up ---------- */
const RVSEL=".amod,.hhead,.kitcard,.pathstep,.path .arrow,.whyitem,.hgallery figure,.how li,.howctas,.faq,.ctabox,.who > *,.facts,.quotes figure,.gcols section,.gbom,.gcta,.soonpage > *";
let rvObs=null;
function countUp(el){const end=parseInt(el.textContent,10);if(!(end>0))return;const t0=performance.now(),dur=900;
  const f=now=>{const k=Math.min(1,(now-t0)/dur);el.textContent=Math.round(end*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f);};el.textContent="0";requestAnimationFrame(f);}
function revealScan(){
  if(!("IntersectionObserver" in window)||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  document.documentElement.classList.add("anim");
  rvObs=rvObs||new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const el=e.target;el.classList.add("in");rvObs.unobserve(el);
    if(el.classList.contains("facts"))el.querySelectorAll("b").forEach(countUp);}),{rootMargin:"0px 0px -6% 0px",threshold:.08});
  document.querySelectorAll(RVSEL).forEach(el=>{if(el.classList.contains("rv"))return;el.classList.add("rv");
    const sib=[...el.parentElement.children].filter(c=>c.matches(RVSEL));el.style.setProperty("--d",Math.min(sib.indexOf(el),5)*90+"ms");rvObs.observe(el);});
}

   unless the module itself is driving the bus. */
